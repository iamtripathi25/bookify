global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The app in this compose stack.
  - job_name: bookify
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
        labels:
          env: local

  # Optional: a deployed instance, so the same dashboard can watch it (pick env=live in Grafana).
  # Set it with observability/watch-live.sh <https-url>; Prometheus picks the file up within 10s.
  - job_name: bookify-live
    # Over the internet the ~170 KB metrics page usually takes ~1s but can take several; the 5s
    # default (timeout = interval) dropped scrapes and left gaps in the dashboard.
    scrape_interval: 15s
    scrape_timeout: 12s
    scheme: https
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: ["/etc/prometheus/live/*.json"]
        refresh_interval: 10s
