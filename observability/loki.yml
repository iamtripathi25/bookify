# Single-process Loki for local use. Based on the image's default config, plus the features
# Grafana's Logs Drilldown app needs (patterns, volume, detected levels).
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Drilldown's Patterns tab (/loki/api/v1/patterns returns 404 without it).
pattern_ingester:
  enabled: true

limits_config:
  # Drilldown's log volume charts.
  volume_enabled: true
  allow_structured_metadata: true
  # Detects a level for each line (ours already carry "level") for the level filter.
  discover_log_levels: true
  retention_period: 168h

analytics:
  reporting_enabled: false
