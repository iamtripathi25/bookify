services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_DB: bookify
      POSTGRES_USER: ${DB_USER:-bookify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookify}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bookify"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/bookify}
      DB_USER: ${DB_USER:-bookify}
      DB_PASSWORD: ${DB_PASSWORD:-bookify}
      BOOKIFY_JWT_SECRET: ${BOOKIFY_JWT_SECRET:-local-dev-secret-not-for-production-0123456789}
      BOOKIFY_DEV_AUTH_ENABLED: ${BOOKIFY_DEV_AUTH_ENABLED:-true}
      BOOKIFY_ADMIN_KEY: ${BOOKIFY_ADMIN_KEY:-local-dev-admin-key}
      JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  # Optional metrics stack: docker compose --profile observability up
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    depends_on:
      - app
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      # Local only: open the dashboard without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bookify.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
