spring:
  application:
    name: bookify
  threads:
    virtual:
      # Requests waiting for a DB connection park cheaply instead of holding platform threads.
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookify}
    username: ${DB_USER:bookify}
    password: ${DB_PASSWORD:bookify}
    hikari:
      # Names the pool in metrics (hikaricp_*{pool="main"}).
      pool-name: main
      # Below Postgres max_connections (100) minus admin headroom and the 2-connection health pool.
      maximum-pool-size: 30
      minimum-idle: 30
      # The 30s default throws SQLTransientConnectionException under the burst; queue instead.
      connection-timeout: 60000
      # Per connection rather than ALTER ROLE (managed Postgres may not allow it).
      # A lock wait past 3s means contention -> 409; statement_timeout stays above it.
      connection-init-sql: SET lock_timeout = '3s'; SET statement_timeout = '30s'
  jackson:
    # The API speaks snake_case (price_paise, reservation_id, ...).
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Unknown fields (e.g. a spoofed user_id) are ignored, never bound.
      fail-on-unknown-properties: false
  sql:
    init:
      # Spring skips schema.sql on non-embedded databases unless told otherwise.
      mode: always

server:
  tomcat:
    # The default of 8192 refuses part of a 20k burst.
    max-connections: 20000
    # Backlog for connection spikes.
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # "db" is our own indicator on the small health pool (see HealthDbPool),
          # so readiness never queues behind the burst.
          include: readinessState,db
  metrics:
    distribution:
      # Real histogram buckets, so Prometheus can compute p50/p95/p99 across instances.
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
  health:
    # Replaced by DbHealthIndicator; the built-in one would use the main pool.
    db:
      enabled: false

bookify:
  dev-auth:
    # Secure by default: POST /auth/token only exists when explicitly enabled.
    enabled: ${BOOKIFY_DEV_AUTH_ENABLED:false}
    # Required (X-Admin-Key header) to mint ADMIN tokens. Blank disables admin minting.
    admin-key: ${BOOKIFY_ADMIN_KEY:}
  jwt:
    # HS256 key, at least 32 bytes; startup fails otherwise.
    secret: ${BOOKIFY_JWT_SECRET:}
    # Both are set on minted tokens and validated on every request.
    issuer: bookify
    audience: bookify-api
    # Long enough for a burst run, short enough to limit a leaked token.
    token-ttl: 1h
  health-db:
    # Fail closed fast: readiness returns 503 within ~2s when Postgres is unreachable.
    timeout-seconds: 2
